# Model registry. Environment-specific overrides can live in config/models.dev.yaml,
# config/models.uat.yaml, and config/models.prod.yaml.
model_registry:
  prefect:
    work_pool_name: cortex-models
    work_pool_type: process
    work_queue_name: default
    deployment_prefix: cortex

  postgres:
    replica_url: postgresql+psycopg://readonly:readonly@postgres-replica:5432/cortex
    pool_size: 1
    pool_pre_ping: true

  kafka:
    bootstrap_servers: localhost:9092
    client_id: cortex-models
    acks: all

  cohort_model_store: &cohort_model_store
    provider: custom
    version: "0.1.0"
    uri: cohorts

  cohort_player_output: &cohort_player_output
    adapter: app.inference.prediction_adapters:generic_insight_event_adapter
    entity_mappings:
      - type: Player
        field: player_id
        present_in_user_interface: true
      - type: SESSION
        field: latest_session_id
        present_in_user_interface: false
    actions:
      available: ["review", "export"]
      default: review
      time_to_live: 30
      export:
        formats: ["pdf", "csv"]
        scope: recommendation

  cohort_kafka: &cohort_kafka
    topic: model-service-insights
    key_field: player_id

  cohort_queries: &cohort_queries
    - name: eligible_players
      sql: |
        SELECT b.player_id AS "PlayerId"
        FROM t_bet b
        JOIN t_game g ON g.game_id = b.game_id
        WHERE g.gaming_day >= :gaming_day_start
          AND g.gaming_day < :gaming_day_end_exclusive
          AND b.bet_id IS NOT NULL
          AND b.session_id IS NOT NULL
          AND b.player_id IS NOT NULL
        GROUP BY b.player_id
        HAVING COUNT(*) >= :minimum_bets
      params:
        gaming_day_start: "{{ gaming_day_start }}"
        gaming_day_end_exclusive: "{{ gaming_day_end_exclusive }}"
        minimum_bets: "{{ minimum_bets }}"
      df_columns: ["PlayerId"]

    - name: games
      sql: |
        SELECT DISTINCT
          g.game_id AS "GameId",
          g.game_start_dtm AS "GameStartDtm",
          g.gaming_day AS "GamingDay",
          g.game_type AS "GameType",
          g.outcome AS "Outcome",
          g.game_result AS "GameResult",
          g.shoe_id AS "ShoeId",
          g.shoe_game_count AS "ShoeGameCount",
          g.table_id AS "TableId",
          g.table_name AS "TableName",
          g.pit_name AS "PitName",
          g.gaming_area AS "GamingArea",
          g.num_players AS "NumPlayers",
          g.num_positions AS "NumPositions"
        FROM t_game g
        JOIN t_bet b ON b.game_id = g.game_id
        WHERE g.gaming_day >= :gaming_day_start
          AND g.gaming_day < :gaming_day_end_exclusive
          AND g.game_id IS NOT NULL
          AND b.player_id = ANY(:player_ids)
          AND b.bet_id IS NOT NULL
          AND b.session_id IS NOT NULL
      params:
        gaming_day_start: "{{ gaming_day_start }}"
        gaming_day_end_exclusive: "{{ gaming_day_end_exclusive }}"
      df_columns: ["GameId", "GameStartDtm", "GamingDay", "GameType", "Outcome", "GameResult", "ShoeId", "ShoeGameCount", "TableId", "TableName", "PitName", "GamingArea", "NumPlayers", "NumPositions"]
      batch_source_query: eligible_players
      batch_source_column: PlayerId
      batch_param: player_ids
      deduplicate_on: ["GameId"]

    - name: bets
      sql: |
        SELECT
          b.bet_id AS "BetId",
          b.game_id AS "GameId",
          b.session_id AS "SessionId",
          b.player_id AS "PlayerId",
          b.table_id AS "TableId",
          b.bet_type AS "BetType",
          b.type_of_bet AS "TypeOfBet",
          b.short_bet_name_en AS "ShortBetNameEn",
          b.wager AS "Wager",
          b.casino_win AS "CasinoWin",
          b.theo_win AS "BetTheoWin",
          b.status AS "Status",
          b.payout_complete_dtm AS "PayoutCompleteDtm"
        FROM t_bet b
        JOIN t_game g ON g.game_id = b.game_id
        WHERE g.gaming_day >= :gaming_day_start
          AND g.gaming_day < :gaming_day_end_exclusive
          AND b.player_id = ANY(:player_ids)
          AND b.bet_id IS NOT NULL
          AND b.session_id IS NOT NULL
          AND b.player_id IS NOT NULL
      params:
        gaming_day_start: "{{ gaming_day_start }}"
        gaming_day_end_exclusive: "{{ gaming_day_end_exclusive }}"
      df_columns: ["BetId", "GameId", "SessionId", "PlayerId", "TableId", "BetType", "TypeOfBet", "ShortBetNameEn", "Wager", "CasinoWin", "BetTheoWin", "Status", "PayoutCompleteDtm"]
      batch_source_query: eligible_players
      batch_source_column: PlayerId
      batch_param: player_ids

    - name: sessions
      sql: |
        SELECT DISTINCT
          s.session_id AS "SessionId",
          s.table_id AS "TableId",
          s.player_id AS "PlayerId",
          s.session_start_dtm AS "SessionStartDtm",
          s.session_end_dtm AS "SessionEndDtm",
          s.first_wager_game_start_dtm AS "FirstWagerGameStartDtm",
          s.gaming_day AS "GamingDay",
          s.num_bets AS "NumBets",
          s.num_games_elapsed AS "NumGamesElapsed",
          s.num_games_with_wager AS "NumGamesWithWager",
          s.turnover AS "Turnover",
          s.theo_win AS "TheoWin",
          s.player_win AS "PlayerWin",
          s.buyin AS "Buyin",
          s.adjusted_theo_win AS "AdjustedTheoWin",
          s.game_type AS "GameType",
          s.pit_name AS "PitName",
          s.gaming_area AS "GamingArea",
          s.table_name AS "TableName"
        FROM t_session s
        WHERE s.gaming_day >= :gaming_day_start
          AND s.gaming_day < :gaming_day_end_exclusive
          AND s.player_id = ANY(:player_ids)
          AND EXISTS (
            SELECT 1
            FROM t_bet b
            JOIN t_game g ON g.game_id = b.game_id
            WHERE b.session_id = s.session_id
              AND b.player_id = s.player_id
              AND g.gaming_day >= :gaming_day_start
              AND g.gaming_day < :gaming_day_end_exclusive
              AND b.bet_id IS NOT NULL
          )
      params:
        gaming_day_start: "{{ gaming_day_start }}"
        gaming_day_end_exclusive: "{{ gaming_day_end_exclusive }}"
      df_columns: ["SessionId", "TableId", "PlayerId", "SessionStartDtm", "SessionEndDtm", "FirstWagerGameStartDtm", "GamingDay", "NumBets", "NumGamesElapsed", "NumGamesWithWager", "Turnover", "TheoWin", "PlayerWin", "Buyin", "AdjustedTheoWin", "GameType", "PitName", "GamingArea", "TableName"]
      batch_source_query: eligible_players
      batch_source_column: PlayerId
      batch_param: player_ids
      deduplicate_on: ["SessionId", "PlayerId"]

  models:
    predicted_fills:
      enabled: true
      description: Predicted Fills inference pipeline
      version: "1.0.0"
      features_version: "1.0"
      type: PredictedFills
      source: cortex.models.predicted_fills
      output_schema_version: 1.0
      severity_default: critical
      parameters:
        end_ts: now # now or %Y-%m-%d_%H-%M-%S
        start_offset_min: 60
        snapshot_minute: 60
        threshold: 0.60
        json_limit: 100
        opportunistic_min_prob: 0.30
        avoided_future_trip_minutes: 8.0
        same_pit_extra_stop_minutes: 2.0
        max_extra_stops_per_route: 2


      schedule:
        enabled: false
        type: cron
        cron: "*/15 * * * *"
        timezone: UTC
        concurrency_limit: 1

      queries:
        - name: tray_scans
          sql: |
            SELECT
              table_id,
              total_tray_value AS tray_balance,
              scan_dtm AS tray_ts,
              scan_type,
              table_name,
              pit_name,
              gaming_area,
              top_tray_chip_count,
              bottom_tray_chip_count
            FROM t_cage_chip_tray_scan
            WHERE scan_dtm >= :tray_lower
              AND scan_dtm <= :end_ts
              AND table_id IS NOT NULL
              AND scan_dtm IS NOT NULL
          params:
            tray_lower: "{{ tray_lower }}"
            end_ts: "{{ end_ts }}"
          df_columns: ["table_id", "tray_balance", "tray_ts", "scan_type", "table_name", "pit_name", "gaming_area", "top_tray_chip_count", "bottom_tray_chip_count"]

        - name: chip_inventory
          sql: |
            SELECT DISTINCT ON (chip_id)
              topology_id AS table_id,
              chip_id,
              denom,
              updated_dtm AS updated_ts,
              owner_type,
              status,
              last_transaction
            FROM t_chip
            WHERE (updated_dtm <= :end_ts OR updated_dtm IS NULL)
              AND topology_id IS NOT NULL
              AND denom IS NOT NULL
            ORDER BY chip_id, updated_dtm DESC NULLS LAST
          params:
            end_ts: "{{ end_ts }}"
          df_columns: ["table_id", "chip_id", "denom", "updated_ts", "owner_type", "status", "last_transaction"]

        - name: chip_updates
          sql: |
            SELECT
              created_dtm AS update_ts,
              txn_update_type AS update_type,
              txn_update_value AS update_value,
              from_topology_id AS from_table_id,
              to_topology_id AS to_table_id,
              chips AS chips_raw
            FROM t_chip_txn_update
            WHERE created_dtm >= :lower
              AND created_dtm <= :end_ts
          params:
            lower: "{{ lower }}"
            end_ts: "{{ end_ts }}"
          df_columns: ["update_ts", "update_type", "update_value", "from_table_id", "to_table_id", "chips_raw"]

        - name: bets
          sql: |
            SELECT
              table_id,
              payout_complete_dtm AS payout_ts,
              casino_win,
              casino_loss_from_nn AS casino_loss
            FROM t_bet
            WHERE payout_complete_dtm >= :lower
              AND payout_complete_dtm <= :end_ts
              AND table_id IS NOT NULL
              AND payout_complete_dtm IS NOT NULL
          params:
            lower: "{{ lower }}"
            end_ts: "{{ end_ts }}"
          df_columns: ["table_id", "payout_ts", "casino_win", "casino_loss"]

        - name: topology
          sql: |
            SELECT
              topology_id AS table_id,
              name AS topology_name,
              description,
              status AS topology_status,
              device_type,
              game_type,
              table_type
            FROM t_topology
            WHERE topology_id IS NOT NULL
          df_columns: ["table_id", "topology_name", "description", "topology_status", "device_type", "game_type", "table_type"]

      model_store:
        provider: mlflow
        tracking_uri: http://mlflow:5000
        registered_model_name: PredictedFills
        version: "10.2.0"

      output:
        adapter: app.inference.prediction_adapters:generic_insight_event_adapter
        entity_mappings:
          - type: TABLE
            field: table_id
            present_in_user_interface: true
          - type: Player
            field: player_id
            present_in_user_interface: true
          - type: bet_id
            field: bet_id
            present_in_user_interface: false
          - type: game_id
            field: game_id
            present_in_user_interface: false
          - type: topology_id
            field: topology_id
            present_in_user_interface: false
        actions:
          available: ["approve", "decline", "export"]
          default: archive
          time_to_live: 45
          requires_reason_on: ["decline"]
          export:
            formats: ["pdf", "csv"]
            scope: recommendation

      kafka:
        topic: model-service-insights
        key_field: table_id

    ShoeAdvantage:
      enabled: true
      description: Shoe Advantage inference pipeline
      version: "1.0.0"
      features_version: "1.0"
      type: ShoeAdvantage
      source: cortex.models.shoe_advantage
      output_schema_version: 1.0
      severity_default: medium
      parameters:
        end_ts: now # now or %Y-%m-%d_%H-%M-%S
        start_offset_min: 5
        model_set: recommended
        model_version: recommended
        feature_version: "1.0"
        hand_id_mode: next
        json_limit: 0

      schedule:
        enabled: false
        type: cron
        cron: "*/5 * * * *"
        timezone: UTC
        concurrency_limit: 1

      queries:
        - name: game_rows
          sql: |
            WITH active_shoes AS (
              SELECT DISTINCT shoe_id
              FROM t_game
              WHERE payout_complete_dtm >= :start_ts
                AND payout_complete_dtm <= :end_ts
                AND shoe_id IS NOT NULL
                AND game_id IS NOT NULL
                AND payout_complete_dtm IS NOT NULL
                AND (
                  UPPER(COALESCE(game_type, '')) LIKE '%BACCARAT%'
                  OR UPPER(COALESCE(game_variant, '')) LIKE '%BACCARAT%'
                  OR UPPER(COALESCE(table_template, '')) LIKE '%BACCARAT%'
                )
            )
            SELECT
              g.game_id AS "GameId",
              g.shoe_id AS "ShoeId",
              g.shoe_game_count AS "ShoeGameCount",
              g.card_p1 AS "CardP1",
              g.card_p2 AS "CardP2",
              g.card_p3 AS "CardP3",
              g.card_b1 AS "CardB1",
              g.card_b2 AS "CardB2",
              g.card_b3 AS "CardB3",
              g.player_score AS "PlayerScore",
              g.banker_score AS "BankerScore",
              COALESCE(g.outcome, g.game_result) AS "Outcome",
              g.game_start_dtm AS "GameStartDtm",
              g.payout_complete_dtm AS "PayoutCompleteDtm",
              g.gaming_day AS "GamingDay",
              g.table_id AS "TableId",
              g.table_name AS "TableName",
              g.pit_name AS "PitName",
              g.gaming_area AS "GamingArea",
              g.game_type AS "GameType",
              g.game_status AS "GameStatus"
            FROM t_game g
            JOIN active_shoes active ON active.shoe_id = g.shoe_id
            WHERE g.payout_complete_dtm <= :end_ts
              AND g.game_id IS NOT NULL
              AND g.shoe_id IS NOT NULL
              AND (
                UPPER(COALESCE(g.game_type, '')) LIKE '%BACCARAT%'
                OR UPPER(COALESCE(g.game_variant, '')) LIKE '%BACCARAT%'
                OR UPPER(COALESCE(g.table_template, '')) LIKE '%BACCARAT%'
              )
            ORDER BY g.shoe_id, g.shoe_game_count, g.game_start_dtm, g.game_id
          params:
            start_ts: "{{ start_ts }}"
            end_ts: "{{ end_ts }}"
          df_columns: ["GameId", "ShoeId", "ShoeGameCount", "CardP1", "CardP2", "CardP3", "CardB1", "CardB2", "CardB3", "PlayerScore", "BankerScore", "Outcome", "GameStartDtm", "PayoutCompleteDtm", "GamingDay", "TableId", "TableName", "PitName", "GamingArea", "GameType", "GameStatus"]

      model_store:
        provider: custom
        version: recommended

      output:
        adapter: app.inference.prediction_adapters:generic_insight_event_adapter
        entity_mappings:
          - type: SHOE
            field: shoe_id
            present_in_user_interface: true
          - type: GAME
            field: game_id
            present_in_user_interface: false
          - type: TABLE
            field: table_id
            present_in_user_interface: true
        actions:
          available: ["review", "export"]
          default: review
          time_to_live: 15

      kafka:
        topic: model-service-insights
        key_field: shoe_id

    cohort:
      enabled: true
      description: Player cohort assignment inference pipeline
      version: "1.0.0"
      features_version: "1.0"
      type: PlayerCohort
      source: cortex.models.player-cohorts
      output_schema_version: 1.0
      severity_default: info
      parameters:
        gaming_day_end: now
        observation_days: 21
        minimum_bets: 30
        extract_batch_size: 500
        extract_workers: 4
        json_limit: 0 # 0 publishes every eligible player
        recommend_all: true

      schedule:
        enabled: false
        type: cron
        cron: "0 8 * * *"
        timezone: UTC
        concurrency_limit: 1

      queries: *cohort_queries
      model_store: *cohort_model_store
      output: *cohort_player_output
      kafka: *cohort_kafka

    cohort_tier_lift:
      enabled: true
      description: Cohort tier lift recommendation inference pipeline
      version: "1.0.0"
      features_version: "1.0"
      type: CohortTierLift
      source: cortex.models.cohort-tier-lift
      output_schema_version: 1.0
      severity_default: high
      parameters:
        gaming_day_end: now
        observation_days: 21
        minimum_bets: 30
        extract_batch_size: 500
        extract_workers: 4
        json_limit: 0 # 0 publishes every eligible player
        recommend_all: true

      schedule:
        enabled: false
        type: cron
        cron: "0 8 * * *"
        timezone: UTC
        concurrency_limit: 1

      queries: *cohort_queries
      model_store: *cohort_model_store
      output: *cohort_player_output
      kafka: *cohort_kafka

    playerscore:
      enabled: true
      description: Player performance score inference pipeline
      version: "1.0.0"
      features_version: "1.0"
      type: PlayerPerformance
      source: cortex.models.player-performance
      output_schema_version: 1.0
      severity_default: medium
      parameters:
        gaming_day_end: now
        observation_days: 21
        minimum_bets: 30
        extract_batch_size: 500
        extract_workers: 4
        json_limit: 0 # 0 publishes every eligible player
        recommend_all: true

      schedule:
        enabled: false
        type: cron
        cron: "0 8 * * *"
        timezone: UTC
        concurrency_limit: 1

      queries: *cohort_queries
      model_store: *cohort_model_store
      output: *cohort_player_output
      kafka: *cohort_kafka
